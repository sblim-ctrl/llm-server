# alembic 설정 — DB URL은 alembic/env.py가 app.config.get_settings()에서 읽어오므로
# 아래 sqlalchemy.url은 사용되지 않는다 (SSOT: .env / app/config.py).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# alembic/env.py가 런타임에 app.config.get_settings().database_url로 덮어쓴다.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]

# Logging configuration. Consumed by the user-maintained env.py script only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
