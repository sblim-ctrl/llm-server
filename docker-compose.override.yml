# 로컬 전용 오버라이드 — 저장소에 커밋하지 말 것 (git에 추적되지 않는 상태로 둔다).
#
# 왜 있나: 기존 dev DB(budgetops_llm)에는 T9 이전 데모 데이터가 남아 있다
# (jobs 100행 · context_chunks 43행, 전부 구 문자열 ID). 현재 schema.sql은 이 컬럼을
# BIGINT로 바꾸는데, 비숫자 값이 있으면 가드가 RAISE해서 컨테이너가 기동에 실패한다
# (배포 체크리스트 §5에 적힌 그 지뢰다). 기존 DB를 지우지 않고 새 DB로 붙인다.
#
# 원래대로 돌리려면 이 파일만 지우고 `docker compose up -d --force-recreate` 하면 된다.
services:
  llm-api:
    environment:
      DATABASE_URL: postgresql://budgetops:budgetops@llm-postgres:5432/budgetops_llm_t9

  llm-worker:
    environment:
      DATABASE_URL: postgresql://budgetops:budgetops@llm-postgres:5432/budgetops_llm_t9
