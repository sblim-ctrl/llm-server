    # 예산 집행 원칙+지출 심사 → 제3조, 참여 요건+청구의 진실성 → 제5조,
    # 증빙+회계 공개 → 제6조, 예외 승인+회칙의 개정 → 제7조.
    # 총무의 구체 의무는 '증빙과 회계' 조에 있으므로 여기서 되풀이하지 않는다.
