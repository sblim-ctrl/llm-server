    transport: {basis: per_person, ratio: 0.25, min: 20000, max: 200000}
    event: {basis: total, ratio: 0.15, min: 50000, max: 2000000}
    gift: {basis: total, ratio: 0.08, min: 30000, max: 400000}
    travel: {basis: per_person, ratio: 0.50, min: 50000, max: 600000}
  max_extra_rules: 2
  dues_default: 30000
  dues_period: 월
  bylaw_articles:
    # 친목은 가장 가벼운 유형 — 7조(회비 미입력 시 6조). 조직 운영 조항을 최소로 두고
