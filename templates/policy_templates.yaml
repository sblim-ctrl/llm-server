회사:
  base_rules:
    - "모든 지출은 증빙(영수증·세금계산서)을 첨부해야 한다."
    - "1인당 회식비는 회당 {meal}원을 초과할 수 없다."
    - "경조사비·접대비는 별도 승인 절차를 따른다."
    - "법인카드 사용 건도 지출 등록·심사를 거친다."
    - "{auto_approve_limit}원 미만 지출은 AI 자동 심사, {auto_approve_limit}원 이상은 관리자 승인."
  limits:
    meal: {basis: per_person, ratio: 0.15, min: 20000, max: 80000}
    venue: {basis: total, ratio: 0.04, min: 30000, max: 400000}
    supplies: {basis: total, ratio: 0.08, min: 30000, max: 400000}
    transport: {basis: per_person, ratio: 0.25, min: 20000, max: 120000}
    education: {basis: per_person, ratio: 0.40, min: 30000, max: 400000}
    event: {basis: total, ratio: 0.08, min: 50000, max: 600000}
  dues_default: 0
  bylaw_articles:
    - title: 목적
      text: "이 규정은 팀 운영비의 집행과 증빙, 정산에 관한 기준을 정하여 지출의 적정성과 회계의 투명성을 확보하는 것을 목적으로 한다."
    - title: 적용 범위
      text: "① 이 규정은 팀 공동 경비로 집행하는 모든 지출에 적용한다. ② 법인카드 사용 건도 예외 없이 지출 등록과 심사를 거친다."
    - title: 책임
      text: "① 팀 운영 책임자는 예산의 편성과 집행을 총괄한다. ② 총무 담당자는 지출 기록, 증빙 보관, 정산 내역 공유를 담당한다."
    - title: 예산 집행 원칙
      text: "① 지출은 편성된 예산과 잔액의 범위 안에서 집행한다. ② 잔액을 초과하는 지출은 집행하지 않으며, 필요한 경우 사전에 예산 조정을 거친다."
    - title: 지출 승인 기준
      text: "① {auto_approve_limit}원 미만 지출은 AI 자동 심사로 처리한다. ② {auto_approve_limit}원 이상 지출은 관리자 승인을 받는다. ③ 승인 기준을 회피할 목적으로 동일 건을 분할 결제해서는 안 된다."
    - title: 인정 가능한 지출
      text: "① 식비: 업무와 관련된 회식·간식 비용은 1인 1회 {meal}원 범위에서 인정한다. ② 회의: 회의 진행에 필요한 비용은 실비로 인정하되 참석자와 안건을 기록한다. ③ 비품: 공동 사용 사무 물품은 분기 {supplies}원 범위에서 인정한다."
    - title: 교육·행사
      text: "① 교육: 업무 관련 교재·강의·세미나 참가비는 1인당 {education}원 범위에서 인정한다. ② 행사_활동: 팀 워크숍·행사 비용은 건당 {event}원 범위에서 인정하며 계획을 사전에 공유한다."
    - title: 교통·대관
      text: "① 교통: 업무 목적 이동에 사용한 교통비는 1인당 {transport}원 범위에서 실비로 인정한다. ② 장소_대관: 외부 회의·행사 공간 대관은 회당 {venue}원 범위에서 인정한다."
    - title: 경조사비·접대비
      text: "경조사비와 접대비는 이 규정의 자동 심사 대상에서 제외하고 별도의 승인 절차를 따른다. 집행 시 대상과 사유를 기록한다."
    - title: 개인성 지출 제한
      text: "개인이 단독으로 소유·사용하는 물품, 개인 식사, 출퇴근 비용 등 업무와 직접 관련이 없는 비용은 팀 경비로 집행하지 않는다."
    - title: 증빙
      text: "① 모든 지출은 영수증·현금영수증·카드전표·세금계산서 등 객관적인 증빙을 남긴다. ② 증빙에는 거래 일시, 금액, 거래처, 지출 내용이 확인되어야 한다. ③ 증빙이 없거나 청구 내용과 일치하지 않으면 정산하지 않는다."
    - title: 회계 기록 및 보관
      text: "① 지출과 잔액은 지속적으로 기록하고 월 1회 이상 공유한다. ② 회계 자료와 증빙은 회계기간 종료 후 최소 1년간 보관한다."
    - title: 예외 승인
      text: "① 규정의 한도를 초과하거나 규정에 정하지 않은 지출이 필요한 경우 사전에 사유와 예상 금액을 공유한다. ② 긴급한 경우 책임자 승인으로 우선 집행하고 사후에 보고한다."
    - title: 규정의 개정
      text: "① 규정의 개정은 팀 구성원 누구나 제안할 수 있다. ② 개정안은 사전에 공유하고 책임자의 확인을 거쳐 시행한다."
