  limits:
    meal: {basis: per_person, ratio: 0.20, min: 15000, max: 90000}
    venue: {basis: total, ratio: 0.04, min: 20000, max: 600000}
    # supplies·transport·travel은 분량 차등화 때 조와 함께 지웠다가 복원 (#83 리뷰 HIGH1):
    # 한도가 빠지면 그 카테고리 청구는 금액과 무관하게 회칙축을 통과한다("금지하지 않는
    # 것은 허용"). 조를 줄여도 한도 규범은 지운 게 아니라 통합이어야 한다.
