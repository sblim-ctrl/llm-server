# 모임 유형별 정책 템플릿 (§12: 유형 추가 = 이 파일에 항목 추가, PolicyDrafter 코드 무수정)
# 실제 모임 생성 화면의 5개 유형 기준. 조항은 '규정 예시'(동아리 지원금 매뉴얼·보조금 관리기준) 참고.
#
# [팀 결정 2026-07-09] AI가 카테고리별 예산을 배분하는 기능은 제거 —
# 예산 현황은 '지난 지출 내역' 기반으로 모임관리 페이지에서 표시(ReportWriter 담당).
# [개정 2026-08-05] 승인 정책 제안도 제거(LLM-005 전면 개정) — {auto_approve_limit}에는
# 마법사 2단계에서 사용자가 입력한 기준 금액이 그대로 들어간다.
# 이 템플릿은 회칙 조항만 담당한다.
#
# ── 키가 둘인 이유 (2026-08-11 개편) ───────────────────────────────────────
#
# base_rules   : **심사용**. 회칙 미등록 팀의 기본 정책 모드(rule_auditor의
#                _audit_by_default_policy)가 근거로 쓴다. 팀이 합의한 적 없는 잣대라
#                판정 강도가 낮고, 조항이 늘면 그만큼 엉뚱한 근거가 검색될 여지가
#                커진다 — 그래서 **의도적으로 짧게 유지**한다. 여기를 늘리지 말 것.
# bylaw_articles: **회칙 초안용**. PolicyDrafter가 관리자에게 제시하는 초안이다.
#                실제 회칙 문서처럼 읽혀야 하므로 항(①②③)을 포함해 충분히 쓴다.
#                관리자가 확정하면 그때 정식 회칙으로 인덱싱되어 심사 근거가 된다.
#
# 종전에는 두 용도가 base_rules 하나를 공유해서, 초안을 풍부하게 만들면 심사 근거까지
# 같이 늘어나는 구조였다. 회칙 초안이 "너무 짧고 당연한 이야기뿐"이라는 지적(2026-08-11
# 배포 데모)을 이 분리로 푼다.
#
# ── 어휘 규약 ─────────────────────────────────────────────────────────────
# 조항에 쓰는 지출 분류 이름은 **전역 카테고리 9종**(templates/category_catalog.yaml)을
# 따른다: 식비·교통·IT_인프라·교육·회의·장소_대관·행사_활동·비품·기타.
# 종전 스터디 템플릿의 "다과비"처럼 카탈로그에 없는 말을 쓰면, 회원이 지출을 올릴 때
# 고를 수 있는 분류와 회칙 용어가 어긋나고 심사기가 엉뚱한 조항을 근거로 물어온다
# (2026-08-11 데모: 장소 대관비 청구에 다과비 조항이 검색됨).
#
# ── 금액 placeholder ──────────────────────────────────────────────────────
# {auto_approve_limit} : 마법사 2단계 사용자 입력(기준 금액). **회칙에서 자동 심사·
#                        관리자 승인을 말하는 조항이 인용할 수 있는 유일한 금액**이다
#                        (verify_draft_pure가 다른 금액을 잡는다 — 옛 4배 배수 규칙 폐기).
# {meal}·{venue}·{supplies}·{transport}·{education}·{event}
#                      : limits 비율로 예산·인원에서 산출된 카테고리별 한도(코드가 계산).
#                        자동 심사 문구와 같은 조항에 쓰지 말 것 — 검증기에 걸린다.
# {dues}               : 회비. 사용자 입력이 있으면 그 값, 없으면 dues_default 기반 제안값.

동아리/학생회:
  # 심사용 — 짧게 유지 (위 주석 참조)
  base_rules:
    - "모든 지출은 영수증(현금영수증·카드전표)을 첨부해야 하며, 미첨부 시 지출로 인정하지 않는다."
    - "1인당 식비는 회당 {meal}원을 초과할 수 없다."
    - "개인 용도 물품 구입은 회비 지출로 인정하지 않는다."
    - "행사비는 행사 계획을 사전 공유한 건에 한해 집행한다."
    - "{auto_approve_limit}원 미만의 지출은 AI 자동 심사로 처리하고, {auto_approve_limit}원 이상은 관리자 승인을 받는다."
  # 예산·인원에서 한도를 뽑는 비율. ratio는 총예산 대비, per_person이면 1인당 예산 대비.
  limits:
    meal: {basis: per_person, ratio: 0.12, min: 12000, max: 50000}
    venue: {basis: total, ratio: 0.03, min: 20000, max: 250000}
    supplies: {basis: total, ratio: 0.08, min: 30000, max: 400000}
    transport: {basis: per_person, ratio: 0.25, min: 20000, max: 100000}
    education: {basis: per_person, ratio: 0.30, min: 20000, max: 200000}
    event: {basis: total, ratio: 0.10, min: 50000, max: 800000}
  dues_default: 10000
  bylaw_articles:
    - title: 목적
      text: "이 회칙은 모임의 운영과 회비·예산의 집행에 관한 기본 사항을 정하여, 회원이 납득할 수 있는 투명한 활동을 이어가는 것을 목적으로 한다."
    - title: 운영 원칙
      text: "모임은 자율적 참여, 상호 존중, 회계의 투명성을 원칙으로 운영한다. 이 회칙에 정하지 않은 사항은 회원 간 합의에 따라 정한다."
    - title: 회원의 의무
      text: "① 회원은 회칙과 공동 의결 사항을 준수한다. ② 회비와 공동 비용은 정해진 기한 내에 납부한다. ③ 맡은 역할은 특별한 사정이 없는 한 성실히 수행한다."
    - title: 운영진
      text: "① 모임은 대표 1인과 총무 1인을 두며, 필요할 경우 운영진을 추가로 둘 수 있다. ② 총무는 회비 수납, 예산 관리, 지출 기록과 증빙 보관, 정산 내역 공개를 담당한다."
    - title: 회비
      text: "회비는 1인당 {dues}원으로 하며, 회비 수입 범위 내에서 지출을 집행한다. 금액과 납부 주기는 회원 합의로 변경할 수 있다."
    - title: 예산 집행 원칙
      text: "① 지출은 편성된 예산과 보유 잔액의 범위 안에서 집행한다. ② 잔액을 초과하는 지출은 원칙적으로 집행하지 않으며, 필요한 경우 사전에 회원 동의를 받는다."
    - title: 지출 승인 기준
      text: "① {auto_approve_limit}원 미만의 지출은 AI 자동 심사로 처리한다. ② {auto_approve_limit}원 이상의 지출은 관리자 승인을 받는다. ③ 승인 기준을 회피할 목적으로 동일한 지출을 나누어 결제해서는 안 된다."
    - title: 인정 가능한 지출
      text: "① 식비: 모임 활동에 수반되는 식사·다과 비용은 1인 1회 {meal}원 범위에서 인정한다. ② 장소_대관: 활동 공간 대관 비용은 회당 {venue}원 범위에서 인정한다. ③ 비품: 공동으로 사용하는 물품 구입은 분기 {supplies}원 범위에서 인정한다. ④ 교통: 모임을 대표한 외부 활동의 교통비는 1인당 {transport}원 범위에서 실비로 인정한다."
    - title: 교육·행사 지출
      text: "① 교육: 활동 목적에 직접 관련된 교재·강의·세미나 참가비는 1인당 {education}원 범위에서 인정한다. ② 행사_활동: 정기 행사, 신입 회원 모집, 홍보물 제작 등 공동 활동 비용은 건당 {event}원 범위에서 인정하며, 행사 계획을 사전에 공유한 건에 한한다."
    - title: 개인성 지출 제한
      text: "개인이 단독으로 소유·사용하는 물품, 개인 식사, 개인 이동 비용 등 공동 활동과 직접 관련이 없는 비용은 회비로 집행하지 않는다."
    - title: 증빙
      text: "① 모든 지출은 영수증·현금영수증·카드전표 등 객관적인 증빙을 남긴다. ② 증빙에는 거래 일시, 금액, 거래처, 지출 내용이 확인되어야 한다. ③ 증빙이 없거나 청구 내용과 증빙이 일치하지 않으면 원칙적으로 정산하지 않는다."
    - title: 회계 공개
      text: "① 총무는 회비 수입, 지출, 잔액을 지속적으로 기록한다. ② 회계 현황은 월 1회 이상 회원에게 공유한다. ③ 회계 자료는 해당 회계기간 종료 후 최소 1년간 보관한다."
    - title: 예외 승인
      text: "① 회칙의 한도를 초과하거나 회칙에 정하지 않은 지출이 필요한 경우 사전에 사유와 예상 금액을 공유한다. ② 긴급하여 사전 승인이 어려운 경우 대표와 총무의 공동 승인으로 우선 집행하고 차기 모임에서 보고한다."
    - title: 회칙의 개정
      text: "① 회칙 개정은 회원 누구나 제안할 수 있다. ② 개정안은 사전에 공유하고 재적 회원 과반의 찬성으로 확정하며, 별도로 정하지 않으면 의결한 날부터 시행한다."

스터디:
  base_rules:
    - "모든 지출은 영수증을 첨부해야 한다."
    - "도서·강의 구입은 스터디 주제와 관련된 항목만 인정한다."
    - "1인당 식비는 회당 {meal}원 한도로 집행한다."
    - "구독형 서비스는 스터디 기간 내 결제분만 인정한다."
    - "{auto_approve_limit}원 미만 지출은 AI 자동 심사, {auto_approve_limit}원 이상은 관리자 승인."
  # 기준선 보정(2026-08-11): 실제 스터디 회칙 예시(8명·예산 120만 규모)의 한도와
  # 자릿수를 맞췄다 — 식비 1.5만 · 대관 3만 · 비품 분기 10만 · 교통 4만 · 교육 6만.
  # 종전 값은 같은 조건에서 절반 수준이라 "회칙에 적힌 한도가 현실과 안 맞는다"는
  # 인상을 줬다.
  limits:
    meal: {basis: per_person, ratio: 0.10, min: 10000, max: 40000}
    venue: {basis: total, ratio: 0.025, min: 20000, max: 200000}
    supplies: {basis: total, ratio: 0.08, min: 30000, max: 400000}
    transport: {basis: per_person, ratio: 0.25, min: 20000, max: 100000}
    education: {basis: per_person, ratio: 0.40, min: 30000, max: 300000}
    event: {basis: total, ratio: 0.04, min: 30000, max: 300000}
  dues_default: 20000
  bylaw_articles:
    - title: 목적
      text: "이 회칙은 스터디의 운영과 회원의 권리·의무, 회비·예산의 집행에 관한 기본 사항을 정하여 지속적이고 투명한 학습 공동체를 운영하는 것을 목적으로 한다."
    - title: 활동
      text: "① 스터디는 학습, 문제 풀이, 발표, 상호 리뷰 등 학습 목적의 활동을 수행한다. ② 정기 활동의 일정과 방식은 회원 합의 또는 운영진 공지로 정한다."
    - title: 회원의 의무
      text: "① 회원은 회칙과 공동 의결 사항을 준수한다. ② 회비는 기한 내 납부하고, 불참이 예상되면 사전에 알린다. ③ 발표·과제 등 맡은 역할은 성실히 수행한다."
    - title: 운영진
      text: "① 스터디는 대표 1인과 총무 1인을 둔다. ② 총무는 회비 수납, 예산 관리, 지출 기록과 증빙 보관, 정산 공개를 담당한다."
    - title: 회비
      text: "회비는 1인당 {dues}원으로 하며, 회비 수입 범위 내에서 지출을 집행한다. 금액과 납부 주기는 운영 상황과 회원 합의에 따라 변경할 수 있다."
    - title: 예산 집행 원칙
      text: "① 지출은 편성된 예산과 보유 잔액의 범위 안에서 집행한다. ② 잔액을 초과하는 지출은 집행하지 않으며, 추가 분담이 필요하면 사전에 회원 동의를 받는다."
    - title: 지출 승인 기준
      text: "① {auto_approve_limit}원 미만 지출은 AI 자동 심사로 처리한다. ② {auto_approve_limit}원 이상 지출은 관리자 승인을 받는다. ③ 승인 기준을 회피하기 위해 동일 목적의 지출을 나누어 결제하지 않는다."
    - title: 인정 가능한 지출
      text: "① 교육: 스터디 주제와 관련된 교재·온라인 강의·세미나 참가비는 1인당 {education}원 범위에서 인정한다. ② 장소_대관: 스터디룸·세미나실 대관 비용은 회당 {venue}원 범위에서 인정한다. ③ 비품: 필기구, 보드마커, 인쇄 용지 등 공동 사용 물품은 분기 {supplies}원 범위에서 인정한다."
    - title: 식비·교통
      text: "① 식비: 정기 모임에 수반되는 식사·간식 비용은 1인 1회 {meal}원 범위에서 인정한다. ② 교통: 스터디를 대표해 외부 대회·행사에 참가하는 경우 교통비는 1인당 {transport}원 범위에서 실비로 인정한다. ③ 주류와 활동에 직접 관련이 없는 개인 소비는 인정하지 않는다."
    - title: 구독형 서비스
      text: "IT_인프라: 학습에 사용하는 구독형 서비스·개발 도구 비용은 스터디 기간 내 결제분만 인정하며, 결제 계정과 사용 목적을 사전에 공유한다."
    - title: 개인성 지출 제한
      text: "개인이 단독으로 소유·사용하는 전자기기, 개인용 소프트웨어, 개인 식사 등 공동 학습과 직접 관련이 없는 비용은 회비로 집행하지 않는다."
    - title: 증빙
      text: "① 모든 지출은 영수증·현금영수증·카드전표 등 객관적인 증빙을 남긴다. ② 증빙에는 거래 일시, 금액, 거래처, 지출 내용이 확인되어야 한다. ③ 증빙이 없거나 청구 내용과 일치하지 않으면 정산하지 않는다."
    - title: 회계 공개
      text: "① 총무는 회비 수입, 지출, 잔액과 증빙을 기록한다. ② 회계 현황은 월 1회 이상 회원에게 공유한다. ③ 회계 자료는 회계기간 종료 후 최소 1년간 보관한다."
    - title: 예외 승인
      text: "① 회칙의 한도를 초과하거나 회칙에 정하지 않은 지출이 필요하면 사전에 사유와 예상 금액을 공유한다. ② 긴급한 경우 대표와 총무의 공동 승인으로 우선 집행하고 차기 모임에서 보고한다."
    - title: 회칙의 개정
      text: "① 회칙 개정은 회원 누구나 제안할 수 있다. ② 개정안은 사전에 공유하고 재적 회원 과반의 찬성으로 확정한다."

친목:
  base_rules:
    - "모든 지출은 영수증을 첨부해야 한다."
    - "1인당 회식비는 회당 {meal}원을 초과할 수 없다."
    - "모임 인원 과반이 참여하지 않은 활동 비용은 인정하지 않는다."
    - "{auto_approve_limit}원 미만 지출은 AI 자동 심사, {auto_approve_limit}원 이상은 관리자 승인."
  limits:
    meal: {basis: per_person, ratio: 0.20, min: 15000, max: 60000}
    venue: {basis: total, ratio: 0.04, min: 20000, max: 250000}
    supplies: {basis: total, ratio: 0.05, min: 20000, max: 200000}
    transport: {basis: per_person, ratio: 0.25, min: 20000, max: 100000}
    education: {basis: per_person, ratio: 0.15, min: 10000, max: 100000}
    event: {basis: total, ratio: 0.15, min: 50000, max: 900000}
  dues_default: 30000
  bylaw_articles:
    - title: 목적
      text: "이 회칙은 모임의 운영과 회비·예산의 집행에 관한 기본 사항을 정하여, 회원이 편안하게 참여하면서도 회계는 투명한 모임을 만드는 것을 목적으로 한다."
    - title: 운영 원칙
      text: "모임은 자발적 참여와 상호 존중을 원칙으로 하며, 회비의 사용 내역은 회원 누구나 확인할 수 있도록 공개한다."
    - title: 회원의 의무
      text: "① 회원은 회칙과 공동 의결 사항을 준수한다. ② 회비는 기한 내 납부한다. ③ 참석을 약속한 모임에 불참하게 되면 가능한 한 사전에 알린다."
    - title: 운영진
      text: "① 모임은 총무 1인을 두어 회비와 지출을 관리한다. ② 총무는 회비 수납, 지출 기록, 증빙 보관, 정산 공개를 담당한다."
    - title: 회비
      text: "회비는 1인당 {dues}원으로 하며, 회비 수입 범위 내에서 지출을 집행한다. 금액과 납부 주기는 회원 합의로 변경할 수 있다."
    - title: 예산 집행 원칙
      text: "① 지출은 보유 잔액의 범위 안에서 집행한다. ② 잔액을 초과하는 지출은 집행하지 않으며, 별도 분담이 필요하면 사전에 회원 동의를 받는다."
    - title: 지출 승인 기준
      text: "① {auto_approve_limit}원 미만 지출은 AI 자동 심사로 처리한다. ② {auto_approve_limit}원 이상 지출은 관리자 승인을 받는다. ③ 승인 기준을 회피하려고 동일 목적의 지출을 나누어 결제하지 않는다."
    - title: 참여 요건
      text: "모임 인원 과반이 참여하지 않은 활동의 비용은 공동 회비로 집행하지 않는다. 다만 사전에 회원 동의를 받은 경우에는 그러하지 아니하다."
    - title: 인정 가능한 지출
      text: "① 식비: 정기 모임의 식사 비용은 1인 1회 {meal}원 범위에서 인정한다. ② 장소_대관: 모임 장소 대관 비용은 회당 {venue}원 범위에서 인정한다. ③ 행사_활동: 정기 나들이·기념 행사 등 공동 활동 비용은 건당 {event}원 범위에서 인정하며, 일정과 예상 금액을 사전에 공유한다."
    - title: 교통·비품
      text: "① 교통: 공동 이동에 사용한 교통비는 참여 인원 기준으로 1인당 {transport}원 범위에서 인정한다. ② 비품: 모임이 공동으로 사용하는 물품은 분기 {supplies}원 범위에서 인정한다."
    - title: 개인성 지출 제한
      text: "개인 식사, 개인 이동, 개인이 소유하는 물품 등 공동 활동과 직접 관련이 없는 비용과, 개인 취향의 고가 메뉴는 회비로 집행하지 않는다."
    - title: 증빙
      text: "① 모든 지출은 영수증·현금영수증·카드전표 등 객관적인 증빙을 남긴다. ② 증빙에는 거래 일시, 금액, 거래처, 지출 내용이 확인되어야 한다. ③ 증빙이 없거나 청구 내용과 일치하지 않으면 정산하지 않는다."
    - title: 회계 공개
      text: "① 총무는 회비 수입, 지출, 잔액을 기록한다. ② 회계 현황은 월 1회 이상 회원에게 공유한다."
    - title: 잔여금
      text: "① 회계기간 종료 시 잔여 회비는 다음 기간으로 이월한다. ② 중도 탈퇴만을 이유로 이미 공동으로 사용한 회비를 소급 환불하지 않는다."
    - title: 회칙의 개정
      text: "① 회칙 개정은 회원 누구나 제안할 수 있다. ② 개정안은 사전에 공유하고 재적 회원 과반의 찬성으로 확정한다."

