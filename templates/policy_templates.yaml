      text: "① 지출은 보유 잔액의 범위 안에서 집행한다. ② 보유 잔액이 부족한 지출은 금액과 관계없이 승인하지 아니한다."
    - title: 지출 심사
      text: "① 1건 {auto_approve_limit}원 미만의 지출은 회칙·예산·증빙을 기준으로 AI가 자동 심사한다. ② 1건 {auto_approve_limit}원 이상의 지출은 관리자 승인을 받는다. ③ 금액과 관계없이 회칙 해석이 불명확한 경우, 증빙이 불충분하거나 청구 내용이 증빙과 일치하지 않는 경우, 중복 청구가 의심되는 경우에는 관리자 확인을 거친다. ④ AI 심사 결과에 이의가 있는 회원은 관리자에게 재심사를 요청할 수 있다."
    - title: 공용 장비
      text: "① 비품비: 공용 장비 구입은 총무와 사전 협의를 거쳐 분기 {supplies}원 이내로 집행한다. ② 구입한 공용 장비는 공용 자산 목록에 등록하고 보관 책임자를 정한다. ③ 1건 {auto_approve_limit}원 이상의 장비 구입은 재적 회원 과반의 찬성을 얻는다."
    - title: 개인 장비
      text: "개인이 단독으로 소유·사용하는 장비와 의류 구입비는 공동 비용으로 집행하지 아니한다."
    - title: 활동 장소
      text: "장소 대관비: 정기 모임 일정에 등록된 일자의 대관료는 회당 {venue}원 이내로 인정한다. 일정 외 대관은 사전에 재적 회원 과반의 찬성을 얻은 경우에 한한다."
    - title: 식비·교통비
      text: "① 식비: 활동 후 공동 식사 비용은 1인 1회 {meal}원 이내로 인정한다. ② 교통비: 원정·외부 행사 참가 시 참여 인원 기준으로 1인당 {transport}원 이내로 인정한다."
    - title: 교육·행사 지출
      text: "① 교육비: 활동 종목과 관련된 강습·자격 과정 비용은 1인당 {education}원 이내로 인정한다. ② 행사·활동비: 정기 행사·친선 교류·홍보물 제작 비용은 건당 {event}원 이내로 인정하며, 계획과 예상 금액을 사전에 공유한다."
    - title: 안전
      text: "① 위험도가 높은 활동은 안전 수칙을 사전에 안내하고 필요한 경우 참가 인원을 제한한다. ② 안전을 위한 보호 장비와 응급 용품 구입비는 공동 지출로 우선 인정한다."
    - title: 청구의 진실성
      text: "① 이미 정산받은 지출을 다시 청구하지 아니한다. ② 승인 기준 금액을 회피할 목적으로 하나의 지출을 여러 건으로 나누어 청구하지 아니한다. ③ 실제 거래와 다른 금액·품목·일자로 청구하지 아니한다."
    - title: 증빙
      text: "① 모든 지출은 영수증·현금영수증·카드전표 등 객관적인 증빙을 첨부한다. ② 증빙에는 거래 일시, 금액, 거래처, 지출 내용이 확인되어야 한다. ③ 증빙이 없거나 내용을 확인하기 어려운 경우 추가 증빙을 요청하고, 확인될 때까지 승인을 보류한다. ④ 사유서만으로는 지출을 인정하지 아니한다."
    - title: 회계 공개
      text: "① 총무는 수입, 지출, 잔액과 공용 자산 현황을 기록한다. ② 회계와 자산 현황은 월 1회 이상 회원에게 공유한다. ③ 회계 자료와 증빙은 해당 회계기간 종료 후 최소 1년간 보관한다."
    - title: 예외 승인
      text: "① 항목별 한도를 초과하지만 전체 잔액이 충분한 지출과, 회칙에 정하지 않은 지출이 필요한 경우에는 사유와 예상 금액을 사전에 공유하고 재적 회원 과반의 찬성을 얻어 집행할 수 있다. ② 긴급하여 사전 승인이 어려운 경우 회장과 총무의 공동 승인으로 우선 집행하고, 다음 모임에서 사유와 증빙을 보고한다. ③ 보유 잔액이 부족한 지출, 이 회칙이 인정하지 않는 개인성 지출, 중복·분할·허위 청구는 예외 승인의 대상이 되지 아니한다."
    - title: 회칙의 개정
      text: "① 회칙 개정은 회원 누구나 제안할 수 있다. ② 개정안은 사전에 공유하고 재적 회원 과반의 찬성으로 확정한다."

회사:
  base_rules:
    - "모든 지출은 증빙(영수증·세금계산서)을 첨부해야 한다."
    - "1인당 회식비는 회당 {meal}원을 초과할 수 없다."
    - "경조사비·접대비는 별도 승인 절차를 따른다."
    - "법인카드 사용 건도 지출 등록·심사를 거친다."
    - "{auto_approve_limit}원 미만 지출은 AI 자동 심사, {auto_approve_limit}원 이상은 관리자 승인."
  limits:
    meal: {basis: per_person, ratio: 0.15, min: 20000, max: 80000}
    venue: {basis: total, ratio: 0.04, min: 30000, max: 400000}
    supplies: {basis: total, ratio: 0.08, min: 30000, max: 400000}
    transport: {basis: per_person, ratio: 0.25, min: 20000, max: 120000}
    education: {basis: per_person, ratio: 0.40, min: 30000, max: 400000}
    event: {basis: total, ratio: 0.08, min: 50000, max: 600000}
    gift: {basis: total, ratio: 0.03, min: 50000, max: 300000}
    travel: {basis: per_person, ratio: 0.40, min: 50000, max: 250000}
  dues_default: 0
  bylaw_articles:
    - title: 목적
      text: "이 규정은 팀 운영비 및 공용경비의 집행 기준을 정하여 예산의 적정성, 승인 책임, 증빙의 완전성을 확보하는 것을 목적으로 한다."
    - title: 적용 범위
      text: "① 이 규정은 회사 예산으로 집행하는 팀 운영비, 회의비, 교육비, 출장비, 소모품비, 행사비에 적용한다. ② 법인카드, 개인 선결제 후 정산, 계좌이체 등 지급 수단과 관계없이 동일하게 적용한다."
    - title: 역할과 책임
      text: "① 지출 요청자는 목적·금액·참여자·예산 항목을 정확히 기재한다. ② 팀 운영 책임자는 업무 필요성과 예산 적정성을 검토한다. ③ 재무 담당자는 증빙과 정책 준수 여부를 확인한다."
    - title: 예산 집행 원칙
      text: "① 지출은 편성된 예산과 잔액의 범위 안에서 집행한다. ② 보유 잔액이 부족한 지출은 금액과 관계없이 승인하지 아니한다."
    - title: 지출 심사
      text: "① 1건 {auto_approve_limit}원 미만의 지출은 규정·예산·증빙을 기준으로 AI가 자동 심사한다. ② 1건 {auto_approve_limit}원 이상의 지출은 관리자 승인을 받는다. ③ 금액과 관계없이 회칙 해석이 불명확한 경우, 증빙이 불충분하거나 청구 내용이 증빙과 일치하지 않는 경우, 중복 청구가 의심되는 경우에는 관리자 확인을 거친다. ④ AI 심사 결과에 이의가 있는 경우 책임자에게 재심사를 요청할 수 있다."
    - title: 사전 승인 대상
      text: "① 출장, 외부 교육, 행사 개최는 집행 전에 목적·일정·예상 금액을 등록하고 승인을 받는다. ② 사전 승인 없이 집행한 지출은 사유서를 제출하고 사후 승인을 받아야 정산한다."
    - title: 인정 가능한 지출
      text: "① 식비: 업무와 관련된 회식·간식 비용은 1인 1회 {meal}원 이내로 인정한다. ② 회의비: 회의 진행에 필요한 비용은 참석자와 안건을 기록한 건에 한해 실비 인정한다. ③ 비품비: 공동 사용 사무 물품은 분기 {supplies}원 이내로 인정한다."
    - title: 교육·행사 지출
      text: "① 교육비: 업무 관련 교재·강의·세미나 참가비는 1인당 {education}원 이내로 인정한다. ② 행사·활동비: 팀 워크숍·행사 비용은 건당 {event}원 이내로 인정하며, 계획과 예상 금액을 사전에 공유한다."
    - title: 교통비·장소 대관비
      text: "① 교통비: 업무 목적 이동 비용은 1인당 {transport}원 이내로 실비 인정한다. ② 장소 대관비: 외부 회의·행사 공간 대관은 회당 {venue}원 이내로 인정한다. ③ 숙박을 동반한 출장은 1인 1박 {travel}원 이내로 인정한다."
    - title: 경조사비·접대비
      text: "① 경조사비는 1건 {gift}원 이내로 집행하며 대상과 사유를 기록한다. ② 접대비는 목적·상대방·참석자를 기록하고 책임자의 사전 승인을 받는다. ③ 두 항목은 AI 자동 심사 대상에서 제외하고 별도 승인 절차를 따른다."
    - title: 인정하지 않는 지출
      text: "① 개인이 단독으로 소유·사용하는 물품 구입비, 개인 식사비, 통근 비용은 인정하지 아니한다. ② 벌금·과태료·연체료는 인정하지 아니한다. ③ 업무와 관련성이 확인되지 않는 지출은 인정하지 아니한다."
    - title: 청구의 진실성
      text: "① 이미 정산받은 지출을 다시 청구하지 아니한다. ② 승인 기준 금액을 회피할 목적으로 하나의 지출을 여러 건으로 나누어 청구하지 아니한다. ③ 실제 거래와 다른 금액·품목·일자로 청구하지 아니한다. ④ 위반이 확인된 경우 해당 지출은 인정하지 않으며 회사 정책에 따라 후속 조치한다."
    - title: 증빙
      text: "① 모든 지출은 영수증·현금영수증·카드전표·세금계산서 등 객관적인 증빙을 첨부한다. ② 증빙에는 거래 일시, 금액, 거래처, 지출 내용이 확인되어야 한다. ③ 증빙이 없거나 내용을 확인하기 어려운 경우 추가 증빙을 요청하고, 확인될 때까지 승인을 보류한다. ④ 사유서만으로는 지출을 인정하지 아니한다."
    - title: 회계 기록 및 보관
      text: "① 지출과 잔액은 지속적으로 기록하고 월 1회 이상 공유한다. ② 회계 자료와 증빙은 해당 회계연도 종료 후 최소 1년간 보관한다. ③ 필요한 경우 내부 점검을 통해 집행 내역의 적정성을 확인한다."
    - title: 예외 승인
      text: "① 항목별 한도를 초과하지만 전체 잔액이 충분한 지출과, 규정에 정하지 않은 지출이 필요한 경우에는 사유와 예상 금액을 사전에 공유하고 책임자의 승인을 받아 집행할 수 있다. ② 긴급하여 사전 승인이 어려운 경우 책임자 승인으로 우선 집행하고 다음 정산 시 사유와 증빙을 보고한다. ③ 보유 잔액이 부족한 지출, 업무 관련성이 확인되지 않는 개인성 지출, 중복·분할·허위 청구는 예외 승인의 대상이 되지 아니한다."
    - title: 규정의 개정
      text: "① 규정의 개정은 구성원 누구나 제안할 수 있다. ② 개정안은 사전에 공유하고 책임자의 확인을 거쳐 시행한다."
