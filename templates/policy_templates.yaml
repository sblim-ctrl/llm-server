    - title: 장비와 안전
      text: "① 비품비: 공용 장비는 총무와 협의해 분기 {supplies}원 이내로 집행하고 자산 목록에 등록한다. ② 위험한 활동은 안전 수칙을 안내하고 필요하면 참가 인원을 제한한다. ③ 보호 장비와 응급 용품은 공동 지출로 우선 인정한다."
    - title: 인정하지 않는 지출
      text: "다음은 인정하지 아니한다. ① 개인이 단독으로 소유·사용하는 장비·의류 구입비 ② 개인 식사비와 통근 등 개인 이동 비용 ③ 모임 활동과 무관하게 개인이 사적으로 사용한 지출·벌금·과태료·연체료 ④ 이미 정산받은 지출의 재청구, 기준 금액 회피용 분할 청구, 실제 거래와 다른 청구"
    - title: 증빙과 회계
      text: "① 지출은 영수증 등 증빙을 첨부하며 일시·금액·거래처·내용이 확인돼야 한다. ② 확인이 어려우면 추가 증빙을 요청하고 확인될 때까지 승인을 보류하며, 사유서만으로는 지출을 인정하지 아니한다. ③ 총무는 수입·지출·잔액과 공용 자산 현황을 월 1회 이상 공유하고 1년간 보관한다."
    - title: 예외 승인과 개정
      text: "① 항목별 한도를 초과하지만 전체 잔액이 충분한 지출은 사유를 사전 공유하고 재적 회원 과반의 찬성으로 집행할 수 있다. ② 보유 잔액 부족·개인성 지출·중복·분할·허위 청구는 예외 승인의 대상이 되지 아니한다. ③ 개정은 재적 회원 과반의 찬성으로 확정한다."

회사:
  base_rules:
    - "모든 지출은 증빙(영수증·세금계산서)을 첨부해야 한다."
    - "1인당 회식비는 회당 {meal}원을 초과할 수 없다."
    - "경조사비·접대비는 별도 승인 절차를 따른다."
    - "법인카드 사용 건도 지출 등록·심사를 거친다."
    - "{auto_approve_limit}원 미만 지출은 AI 자동 심사, {auto_approve_limit}원 이상은 관리자 승인."
  limits:
    meal: {basis: per_person, ratio: 0.15, min: 20000, max: 120000}
    venue: {basis: total, ratio: 0.04, min: 30000, max: 1000000}
    supplies: {basis: total, ratio: 0.08, min: 30000, max: 1000000}
    transport: {basis: per_person, ratio: 0.25, min: 20000, max: 250000}
    education: {basis: per_person, ratio: 0.40, min: 30000, max: 1000000}
    event: {basis: total, ratio: 0.08, min: 50000, max: 1500000}
    gift: {basis: total, ratio: 0.03, min: 50000, max: 600000}
    travel: {basis: per_person, ratio: 0.40, min: 50000, max: 500000}
  max_extra_rules: 4
  dues_default: 0
  bylaw_articles:
    # 회사 11조 — 가장 격식이 높은 유형. '적용 범위'·'역할과 책임'·'사전 승인 대상'·
    # '청구의 진실성'을 별도 조로 유지하는 것이 다른 유형과의 차이다.
    - title: 목적과 적용 범위
      text: "① 이 규정은 회사 예산으로 집행하는 팀 운영비·회의비·교육비·출장비·소모품비·행사비의 집행 기준을 정한다. ② 법인카드·개인 선결제 후 정산·계좌이체 등 지급 수단과 관계없이 동일하게 적용한다."
    - title: 역할과 책임
      text: "① 지출 요청자는 목적·금액·참여자·예산 항목을 정확히 기재한다. ② 팀 운영 책임자는 업무 필요성과 예산 적정성을 검토한다. ③ 재무 담당자는 증빙과 정책 준수 여부를 확인한다."
    - title: 지출 심사
      # ③이 다른 유형에서 복사되며 "회칙"으로 남아 있었다 — 이 유형은 전편이 "규정"이다
      # (2026-08-12 정정).
      text: "① 지출은 편성된 예산과 잔액 범위에서 집행하며, 보유 잔액이 부족한 지출은 금액과 관계없이 승인하지 아니한다. ② 1건 {auto_approve_limit}원 미만은 규정·예산·증빙을 기준으로 AI가 자동 심사하고, 이상은 관리자 승인을 받는다. ③ 금액과 관계없이 규정 해석이 불명확하거나 증빙이 불충분하거나 중복 청구가 의심되면 관리자가 확인한다."
      # ①(잔액 부족) 유지 이유는 동아리/학생회 지출 심사 조 주석 참조 (#83 리뷰 HIGH2)
      text_no_auto: "① 지출은 편성된 예산과 잔액 범위에서 집행하며, 보유 잔액이 부족한 지출은 승인하지 아니한다. ② 모든 지출은 금액과 관계없이 관리자 승인을 받는다. ③ AI는 규정·예산·증빙을 기준으로 심사 의견과 그 근거를 제시하고, 최종 결정은 관리자가 한다."
    - title: 사전 승인 대상
      text: "① 출장, 외부 교육, 행사 개최는 집행 전에 목적·일정·예상 금액을 등록하고 승인을 받는다. ② 사전 승인 없이 집행한 지출은 사유서를 제출하고 사후 승인을 받아야 정산한다."
    - title: 인정 가능한 지출
      text: "① 식비: 업무 관련 회식·간식은 1인 1회 {meal}원 이내로 하며 참석 인원을 적는다. ② 회의비: 참석자와 안건을 기록한 건에 한해 실비 인정한다. ③ 비품비: 공동 사용 사무 물품은 분기 {supplies}원 이내. ④ 교통비: 업무 목적 이동은 1인당 {transport}원 이내로 실비 인정하며 출발지·목적지와 업무명을 적는다. ⑤ 장소 대관비: 외부 회의·행사 공간은 회당 {venue}원 이내. ⑥ 출장 숙박: 1인 1박 {travel}원 이내."
    - title: 교육·행사 지출
      text: "① 교육비: 업무 관련 교재·강의·세미나 참가비는 1인당 {education}원 이내. ② 행사·활동비: 팀 워크숍·행사는 건당 {event}원 이내로 하며 계획과 금액을 사전 공유한다. ③ 대외 활동 참가비: 외부 행사·컨퍼런스 등록비는 건당 {event}원 이내로 하며 참가 인원과 안내를 증빙한다."
    - title: 경조사비·접대비
      # ③에 "AI 자동 심사"라는 말을 쓰지 않는다 — 두 가지 이유가 겹친 자리다 (PR #75와 동일 수정).
      #  ① 사실이 아니다. 가드레일에 카테고리별 제외 경로가 없어(guardrail_gate 참조)
      #     경조사비·접대비도 다른 지출과 똑같이 심사된다.
      #  ② verify_draft_pure가 '자동 심사'를 말하는 조항의 금액을 승인 기준 금액으로
      #     한정하는데, 이 조는 ①에 경조사비 한도({gift})를 품고 있어 둘이 우연히
      #     같지 않으면 초안 생성이 통째로 500이 된다.
      text: "① 경조사비는 1건 {gift}원 이내로 집행하며 대상과 사유를 기록한다. ② 접대비는 목적·상대방·참석자를 기록하고 책임자의 사전 승인을 받는다. ③ 두 항목은 금액과 관계없이 책임자의 별도 승인 절차를 따른다."
    - title: 인정하지 않는 지출
      # ③ 포괄 금지 → 개인성 기준으로 좁힘 (스터디 유형과 같은 이유, 2026-08-12).
      text: "다음은 인정하지 아니한다. ① 개인이 단독으로 소유·사용하는 물품 구입비·개인 식사비·통근 비용 ② 벌금·과태료·연체료 ③ 업무와 무관하게 개인이 사적으로 사용한 지출"
    - title: 청구의 진실성
      text: "① 이미 정산받은 지출을 다시 청구하지 아니한다. ② 승인 기준 금액을 회피할 목적으로 하나의 지출을 나누어 청구하지 아니한다. ③ 실제 거래와 다른 금액·품목·일자로 청구하지 아니한다. ④ 위반이 확인되면 해당 지출을 인정하지 않으며 회사 정책에 따라 후속 조치한다."
    - title: 증빙과 회계 기록
      text: "① 지출은 영수증·세금계산서 등 증빙을 첨부하며 일시·금액·거래처·내용이 확인돼야 한다. ② 확인이 어려우면 추가 증빙을 요청하고 확인될 때까지 승인을 보류하며, 사유서만으로는 지출을 인정하지 아니한다. ③ 지출과 잔액은 월 1회 이상 공유하고 회계 자료는 1년간 보관하며, 필요하면 내부 점검으로 적정성을 확인한다."
    - title: 예외 승인과 규정의 개정
      text: "① 항목별 한도를 초과하지만 전체 잔액이 충분한 지출은 사유를 사전 공유하고 책임자의 승인을 받아 집행할 수 있다. ② 긴급하면 책임자 승인으로 우선 집행하고 다음 정산 시 보고한다. ③ 보유 잔액 부족, 업무 관련성이 확인되지 않는 개인성 지출, 중복·분할·허위 청구는 예외 승인의 대상이 되지 아니한다. ④ 규정의 개정은 사전에 공유하고 책임자의 확인을 거쳐 시행한다."
