# 모임 유형별 정책 템플릿 (§12: 유형 추가 = 이 파일에 항목 추가, PolicyDrafter 코드 무수정)
# 실제 모임 생성 화면의 5개 유형 기준. 조항은 '규정 예시'(동아리 지원금 매뉴얼·보조금 관리기준) 참고.
#
# [팀 결정 2026-07-09] AI가 카테고리별 예산을 배분하는 기능은 제거 —
# 예산 현황은 '지난 지출 내역' 기반으로 모임관리 페이지에서 표시(ReportWriter 담당).
# [개정 2026-08-05] 승인 정책 제안도 제거(LLM-005 전면 개정) — {auto_approve_limit}에는
# 마법사 2단계에서 사용자가 입력한 기준 금액이 그대로 들어간다.
# 이 템플릿은 회칙 조항만 담당한다.
#
# ── 키 구조 (2026-08-11 개편) ─────────────────────────────────────────────
#
# base_rules    : **심사용**. 회칙 미등록 팀의 기본 정책 모드(rule_auditor의
#                 _audit_by_default_policy)가 근거로 쓴다. 팀이 합의한 적 없는 잣대라
#                 판정 강도가 낮고, 조항이 늘면 엉뚱한 근거가 검색될 여지가 커진다 —
#                 **의도적으로 짧게 유지**한다. 여기를 늘리지 말 것.
# limits        : 예산·인원에서 카테고리별 한도를 뽑는 비율·상하한. basis=per_person이면
#                 1인당 예산 기준, total이면 총예산 기준. 코드에 숫자를 두지 않기 위한 자리.
# dues_default  : (참고값) 유형별 통상 회비. **회칙에 자동으로 넣지 않는다** — 회비는
#                 사용자 입력이 있을 때만 조항이 생긴다.
# bylaw_articles: **회칙 초안용**. PolicyDrafter가 관리자에게 제시하는 초안이며, 확정되면
#                 인덱싱되어 심사 근거가 된다. `requires_dues: true`인 조는 회비 입력이
#                 없으면 통째로 빠진다(없는 회비를 전제한 의무 조항을 만들지 않기 위해).
#
# ── 작성 원칙 (2026-08-11 확정) ───────────────────────────────────────────
#
# 1. **AI 자동심사 문구는 유지하되 근거를 밝힌다.** 이 서비스가 AI 지출심사 서비스이므로
#    감출 이유가 없다. 다만 "AI가 승인한다"가 아니라 "회칙·예산·증빙을 기준으로 AI가
#    자동 심사한다"로 쓴다 — 판단 근거가 회칙임을 회원이 알 수 있어야 한다.
# 2. **승인 기준 금액은 실제 숫자로 적는다.** {auto_approve_limit}에 화면 입력값이 들어간다.
#    회칙은 숫자로 말해야 규범으로 기능한다(레퍼런스 회칙 5종도 모두 숫자를 명시).
#    ※ 관리자가 나중에 설정을 바꾸면 회칙 숫자가 낡는다 — 그건 회칙 개정으로 다룰 일이다.
# 3. **예산 초과와 잔액 부족을 구분한다.** 가드레일 동작과 일치시킨다:
#      · 보유 잔액 부족          → 승인하지 않는다 (budget_insufficient → 반려)
#      · 항목 한도 초과·잔액 충분 → 특별 승인 절차 (관리자 확인)
# 4. **모호한 표현을 쓰지 않는다.** "소액", "고가", "적절한", "필요한 경우" 대신 금액이나
#    조건을 명시한다. "회원 동의"도 "재적 회원 과반의 동의"처럼 기준을 밝힌다.
# 5. **허용을 말하는 조항에는 반드시 한도나 조건이 붙는다.** 한도 없는 허용은 심사기가
#    판단할 수 없고, 회원에게도 기준이 되지 못한다.
# 6. **시스템 내부 표기를 쓰지 않는다.** 카테고리 식별자(장소_대관·행사_활동·IT_인프라)가
#    아니라 사람이 쓰는 말(장소 대관비·행사·활동비·IT 인프라 비용)로 적는다. 다만 카탈로그
#    9종에 대응하지 않는 분류명("다과비" 등)은 여전히 금지 — 회원이 지출을 올릴 때 고르는
#    분류와 회칙 용어가 어긋나면 심사기가 엉뚱한 조항을 근거로 물어온다.
#
# ── 금액 placeholder ──────────────────────────────────────────────────────
# {auto_approve_limit} : 화면 입력 기준 금액. **자동 심사·관리자 승인을 말하는 조항이
#                        인용할 수 있는 유일한 금액**이다(verify_draft_pure가 다른 금액을 막는다).
# {meal}·{venue}·{supplies}·{transport}·{education}·{event}·{gift}·{travel}
#                      : limits로 예산·인원에서 산출된 한도. 자동 심사 문구와 같은 조에
#                        쓰지 말 것 — 검증기에 걸린다.
# {dues}               : 회비. 사용자 입력이 있을 때만 치환되며, 없으면 해당 조가 빠진다.

동아리/학생회:
  # 심사용 — 짧게 유지 (위 주석 참조)
  base_rules:
    - "모든 지출은 영수증(현금영수증·카드전표)을 첨부해야 하며, 미첨부 시 지출로 인정하지 않는다."
    - "1인당 식비는 회당 {meal}원을 초과할 수 없다."
    - "개인 용도 물품 구입은 회비 지출로 인정하지 않는다."
    - "행사비는 행사 계획을 사전 공유한 건에 한해 집행한다."
    - "{auto_approve_limit}원 미만의 지출은 AI 자동 심사로 처리하고, {auto_approve_limit}원 이상은 관리자 승인을 받는다."
  limits:
    meal: {basis: per_person, ratio: 0.12, min: 12000, max: 50000}
    venue: {basis: total, ratio: 0.03, min: 20000, max: 250000}
    supplies: {basis: total, ratio: 0.08, min: 30000, max: 400000}
    transport: {basis: per_person, ratio: 0.25, min: 20000, max: 100000}
    education: {basis: per_person, ratio: 0.30, min: 20000, max: 200000}
    event: {basis: total, ratio: 0.10, min: 50000, max: 800000}
    gift: {basis: total, ratio: 0.02, min: 20000, max: 100000}
    travel: {basis: per_person, ratio: 0.40, min: 30000, max: 150000}
  dues_default: 10000
  dues_period: 학기당
  bylaw_articles:
    - title: 목적
      text: "이 회칙은 동아리의 운영과 회비·예산의 집행에 관한 기준을 정하여, 회원이 납득할 수 있는 투명한 활동을 이어가는 것을 목적으로 한다."
    - title: 운영 원칙
      text: "동아리는 회원의 자율적 참여와 상호 존중을 바탕으로 운영하며, 예산의 집행 내역과 의사결정 결과를 회원에게 공개한다."
    - title: 회원의 의무
      text: "① 회원은 회칙과 총회 의결 사항을 준수한다. ② 공동 활동에 필요한 분담금은 정해진 기한 내에 납부한다. ③ 맡은 역할은 특별한 사정이 없는 한 성실히 수행한다."
    - title: 임원
      text: "① 동아리는 회장 1인과 총무 1인을 두며, 필요할 경우 부회장·기획·홍보 담당을 둘 수 있다. ② 회장은 동아리를 대표하고 활동을 총괄한다. ③ 총무는 예산 관리, 지출 기록, 증빙 보관, 정산 내역 공개를 담당한다."
    - title: 의결
      text: "① 회칙 개정, 임원 선출, 연간 예산 확정은 재적 회원 과반의 출석과 출석 회원 과반의 찬성으로 의결한다. ② 일상적인 운영 사항은 임원이 결정하고 그 결과를 회원에게 공유한다."
    - title: 회비
      requires_dues: true
      text: "① 회비는 1인당 {dues_period} {dues}원으로 한다. ② 회비는 정해진 기한 내에 납부한다. ③ 회비의 금액과 납부 주기는 재적 회원 과반의 찬성으로 변경할 수 있다."
    - title: 예산 집행 원칙
      text: "① 지출은 편성된 예산과 보유 잔액의 범위 안에서 집행한다. ② 보유 잔액이 부족한 지출은 금액과 관계없이 승인하지 아니한다."
    - title: 지출 심사
      text: "① 1건 {auto_approve_limit}원 미만의 지출은 회칙·예산·증빙을 기준으로 AI가 자동 심사한다. ② 1건 {auto_approve_limit}원 이상의 지출은 관리자 승인을 받는다. ③ 금액과 관계없이 회칙 해석이 불명확한 경우, 증빙이 불충분하거나 청구 내용이 증빙과 일치하지 않는 경우, 중복 청구가 의심되는 경우에는 관리자 확인을 거친다. ④ AI 심사 결과에 이의가 있는 회원은 관리자에게 재심사를 요청할 수 있다."
    - title: 인정 가능한 지출
      text: "① 식비: 동아리 활동에 수반되는 식사·다과 비용은 1인 1회 {meal}원 이내로 인정한다. ② 장소 대관비: 활동 공간 대관 비용은 회당 {venue}원 이내로 인정한다. ③ 비품비: 공동으로 사용하는 물품 구입은 분기 {supplies}원 이내로 인정한다. ④ 교통비: 동아리를 대표한 외부 활동의 교통비는 1인당 {transport}원 이내로 실비 인정한다."
    - title: 교육·행사 지출
      text: "① 교육비: 활동 목적에 직접 관련된 교재·강의·세미나 참가비는 1인당 {education}원 이내로 인정한다. ② 행사·활동비: 정기 행사, 신입 회원 모집, 홍보물 제작 비용은 건당 {event}원 이내로 인정하며, 행사 계획과 예상 금액을 사전에 공유한 건에 한한다."
    - title: 인정하지 않는 지출
      text: "① 개인이 단독으로 소유·사용하는 물품 구입비, 개인 식사비, 통근 등 개인 이동 비용은 인정하지 아니한다. ② 주류만을 목적으로 한 지출과 회원 일부만 참여한 사적 모임 비용은 인정하지 아니한다. ③ 벌금·과태료·연체료는 인정하지 아니한다."
    - title: 청구의 진실성
      text: "① 이미 정산받은 지출을 다시 청구하지 아니한다. ② 승인 기준 금액을 회피할 목적으로 하나의 지출을 여러 건으로 나누어 청구하지 아니한다. ③ 실제 거래와 다른 금액·품목·일자로 청구하지 아니한다. ④ 위반이 확인된 경우 해당 지출은 인정하지 않으며 임원 회의에서 후속 조치를 정한다."
    - title: 증빙
      text: "① 모든 지출은 영수증·현금영수증·카드전표 등 객관적인 증빙을 첨부한다. ② 증빙에는 거래 일시, 금액, 거래처, 지출 내용이 확인되어야 한다. ③ 증빙이 없거나 내용을 확인하기 어려운 경우 추가 증빙을 요청하고, 확인될 때까지 승인을 보류한다. ④ 사유서만으로는 지출을 인정하지 아니한다."
    - title: 회계 공개
      text: "① 총무는 수입, 지출, 잔액을 지속적으로 기록한다. ② 회계 현황은 월 1회 이상 회원에게 공유한다. ③ 회계 자료와 증빙은 해당 회계연도 종료 후 최소 1년간 보관한다."
    - title: 예외 승인
      text: "① 항목별 한도를 초과하지만 전체 잔액이 충분한 지출과, 회칙에 정하지 않은 지출이 필요한 경우에는 사유와 예상 금액을 사전에 공유하고 재적 회원 과반의 찬성을 얻어 집행할 수 있다. ② 긴급하여 사전 승인이 어려운 경우 회장과 총무의 공동 승인으로 우선 집행하고, 다음 정기 모임에서 사유와 증빙을 보고한다. ③ 보유 잔액이 부족한 지출, 이 회칙이 인정하지 않는 개인성 지출, 중복·분할·허위 청구는 예외 승인의 대상이 되지 아니한다."
    - title: 회칙의 개정
      text: "① 회칙 개정은 회원 누구나 제안할 수 있다. ② 개정안은 사전에 공유하고 재적 회원 과반의 찬성으로 확정하며, 별도로 정하지 않으면 의결한 날부터 시행한다."

스터디:
  base_rules:
    - "모든 지출은 영수증을 첨부해야 한다."
    - "도서·강의 구입은 스터디 주제와 관련된 항목만 인정한다."
    - "1인당 식비는 회당 {meal}원 한도로 집행한다."
    - "구독형 서비스는 스터디 기간 내 결제분만 인정한다."
    - "{auto_approve_limit}원 미만 지출은 AI 자동 심사, {auto_approve_limit}원 이상은 관리자 승인."
  limits:
    meal: {basis: per_person, ratio: 0.10, min: 10000, max: 40000}
    venue: {basis: total, ratio: 0.025, min: 20000, max: 200000}
    supplies: {basis: total, ratio: 0.08, min: 30000, max: 400000}
    transport: {basis: per_person, ratio: 0.25, min: 20000, max: 100000}
    education: {basis: per_person, ratio: 0.40, min: 30000, max: 300000}
    event: {basis: total, ratio: 0.04, min: 30000, max: 300000}
    gift: {basis: total, ratio: 0.02, min: 20000, max: 80000}
    travel: {basis: per_person, ratio: 0.30, min: 30000, max: 120000}
  dues_default: 20000
  dues_period: 월
  bylaw_articles:
    - title: 목적
      text: "이 회칙은 스터디의 운영과 회원의 권리·의무, 공동비용의 집행에 관한 기준을 정하여 지속적이고 투명한 학습 공동체를 운영하는 것을 목적으로 한다."
    - title: 활동
      text: "① 스터디는 학습, 문제 풀이, 발표, 상호 리뷰 등 합의한 학습 주제를 중심으로 운영한다. ② 정기 모임의 일정과 방식은 회원 합의 또는 운영진 공지로 정한다."
    - title: 출석
      text: "① 회원은 정기 모임에 참석하는 것을 원칙으로 하며, 불참이 예상되면 모임 전에 알린다. ② 사전 연락 없이 3회 연속 불참하거나 한 달 이상 활동이 없는 경우 운영진은 본인과 협의하여 휴면 또는 탈퇴로 처리할 수 있다."
    - title: 발표와 과제
      text: "발표·코드 리뷰·문제 출제 담당자는 정해진 기한까지 준비하며, 부득이한 사유가 있으면 사전에 순서를 조정한다."
    - title: 운영진
      text: "① 스터디는 스터디장 1인과 총무 1인을 두며, 소규모인 경우 1인이 겸임할 수 있다. ② 스터디장은 커리큘럼과 일정을 조정하고, 총무는 예산 관리, 지출 기록, 증빙 보관, 정산 공개를 담당한다."
    - title: 회비
      requires_dues: true
      text: "① 회비는 1인당 {dues_period} {dues}원으로 한다. ② 회비는 정해진 기한 내에 납부한다. ③ 고정비가 발생하지 않는 기간에는 재적 회원 과반의 찬성으로 회비 징수를 중단할 수 있다."
    - title: 예산 집행 원칙
      text: "① 지출은 편성된 예산과 보유 잔액의 범위 안에서 집행한다. ② 보유 잔액이 부족한 지출은 금액과 관계없이 승인하지 아니한다."
    - title: 지출 심사
      text: "① 1건 {auto_approve_limit}원 미만의 지출은 회칙·예산·증빙을 기준으로 AI가 자동 심사한다. ② 1건 {auto_approve_limit}원 이상의 지출은 관리자 승인을 받는다. ③ 금액과 관계없이 회칙 해석이 불명확한 경우, 증빙이 불충분하거나 청구 내용이 증빙과 일치하지 않는 경우, 중복 청구가 의심되는 경우에는 관리자 확인을 거친다. ④ AI 심사 결과에 이의가 있는 회원은 관리자에게 재심사를 요청할 수 있다."
    - title: 인정 가능한 지출
      text: "① 교육비: 스터디 주제와 관련된 교재·온라인 강의·세미나 참가비는 1인당 {education}원 이내로 인정한다. ② 장소 대관비: 스터디룸·세미나실 대관 비용은 회당 {venue}원 이내로 인정한다. ③ 비품비: 필기구, 보드마커, 인쇄 용지 등 공동 사용 물품은 분기 {supplies}원 이내로 인정한다."
    - title: 식비·교통비
      text: "① 식비: 정기 모임에 수반되는 식사·간식 비용은 1인 1회 {meal}원 이내로 인정한다. ② 교통비: 스터디를 대표해 외부 대회·행사에 참가하는 경우 1인당 {transport}원 이내로 실비 인정한다."
    - title: IT 인프라 비용
      text: "학습에 사용하는 구독형 서비스·개발 도구 비용은 스터디 기간 내 결제분만 인정하며, 결제 계정과 사용 목적을 사전에 공유한다."
    - title: 인정하지 않는 지출
      text: "① 개인이 단독으로 소유·사용하는 전자기기, 개인용 소프트웨어 구입비는 인정하지 아니한다. ② 개인 식사비와 통근 등 개인 이동 비용은 인정하지 아니한다. ③ 주류 구입비와 학습과 무관한 지출은 인정하지 아니한다."
    - title: 청구의 진실성
      text: "① 이미 정산받은 지출을 다시 청구하지 아니한다. ② 승인 기준 금액을 회피할 목적으로 하나의 지출을 여러 건으로 나누어 청구하지 아니한다. ③ 실제 거래와 다른 금액·품목·일자로 청구하지 아니한다."
    - title: 증빙
      text: "① 모든 지출은 영수증·현금영수증·카드전표 등 객관적인 증빙을 첨부한다. ② 증빙에는 거래 일시, 금액, 거래처, 지출 내용이 확인되어야 한다. ③ 증빙이 없거나 내용을 확인하기 어려운 경우 추가 증빙을 요청하고, 확인될 때까지 승인을 보류한다. ④ 사유서만으로는 지출을 인정하지 아니한다."
    - title: 회계 공개
      text: "① 총무는 수입, 지출, 잔액과 증빙을 기록한다. ② 회계 현황은 월 1회 이상 회원에게 공유한다. ③ 회계 자료와 증빙은 해당 회계기간 종료 후 최소 1년간 보관한다."
    - title: 예외 승인
      text: "① 항목별 한도를 초과하지만 전체 잔액이 충분한 지출과, 회칙에 정하지 않은 지출이 필요한 경우에는 사유와 예상 금액을 사전에 공유하고 재적 회원 과반의 찬성을 얻어 집행할 수 있다. ② 긴급하여 사전 승인이 어려운 경우 스터디장과 총무의 공동 승인으로 우선 집행하고, 다음 모임에서 사유와 증빙을 보고한다. ③ 보유 잔액이 부족한 지출, 이 회칙이 인정하지 않는 개인성 지출, 중복·분할·허위 청구는 예외 승인의 대상이 되지 아니한다."
    - title: 회칙의 개정
      text: "① 회칙 개정은 회원 누구나 제안할 수 있다. ② 개정안은 사전에 공유하고 재적 회원 과반의 찬성으로 확정한다."

친목:
  base_rules:
