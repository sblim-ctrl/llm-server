# 모임 유형별 정책 템플릿 (§12: 유형 추가 = 이 파일에 항목 추가, PolicyDrafter 코드 무수정)
# 실제 모임 생성 화면의 5개 유형 기준. 조항은 '규정 예시'(동아리 지원금 매뉴얼·보조금 관리기준) 참고.
#
# [팀 결정 2026-07-09] AI가 카테고리별 예산을 배분하는 기능은 제거 —
# 예산 현황은 '지난 지출 내역' 기반으로 모임관리 페이지에서 표시(ReportWriter 담당).
# [개정 2026-08-05] 승인 정책 제안도 제거(LLM-005 전면 개정) — {auto_approve_limit}에는
# 마법사 2단계에서 사용자가 입력한 기준 금액이 그대로 들어간다.
# 이 템플릿은 회칙 조항만 담당한다.
#
# ── 키 구조 (2026-08-11 개편) ─────────────────────────────────────────────
#
# base_rules    : **심사용**. 회칙 미등록 팀의 기본 정책 모드(rule_auditor의
#                 _audit_by_default_policy)가 근거로 쓴다. 팀이 합의한 적 없는 잣대라
#                 판정 강도가 낮고, 조항이 늘면 엉뚱한 근거가 검색될 여지가 커진다 —
#                 **의도적으로 짧게 유지**한다. 여기를 늘리지 말 것.
# limits        : 예산·인원에서 카테고리별 한도를 뽑는 비율·상하한. basis=per_person이면
#                 1인당 예산 기준, total이면 총예산 기준. 코드에 숫자를 두지 않기 위한 자리.
# dues_default  : (참고값) 유형별 통상 회비. **회칙에 자동으로 넣지 않는다** — 회비는
#                 사용자 입력이 있을 때만 조항이 생긴다.
# bylaw_articles: **회칙 초안용**. PolicyDrafter가 관리자에게 제시하는 초안이며, 확정되면
#                 인덱싱되어 심사 근거가 된다. `requires_dues: true`인 조는 회비 입력이
#                 없으면 통째로 빠진다(없는 회비를 전제한 의무 조항을 만들지 않기 위해).
#
# ── 작성 원칙 (2026-08-11 확정) ───────────────────────────────────────────
#
# 1. **AI 자동심사 문구는 유지하되 근거를 밝힌다.** 이 서비스가 AI 지출심사 서비스이므로
#    감출 이유가 없다. 다만 "AI가 승인한다"가 아니라 "회칙·예산·증빙을 기준으로 AI가
#    자동 심사한다"로 쓴다 — 판단 근거가 회칙임을 회원이 알 수 있어야 한다.
# 2. **승인 기준 금액은 실제 숫자로 적는다.** {auto_approve_limit}에 화면 입력값이 들어간다.
#    회칙은 숫자로 말해야 규범으로 기능한다(레퍼런스 회칙 5종도 모두 숫자를 명시).
#    ※ 관리자가 나중에 설정을 바꾸면 회칙 숫자가 낡는다 — 그건 회칙 개정으로 다룰 일이다.
# 3. **예산 초과와 잔액 부족을 구분한다.** 가드레일 동작과 일치시킨다:
#      · 보유 잔액 부족          → 승인하지 않는다 (budget_insufficient → 반려)
#      · 항목 한도 초과·잔액 충분 → 특별 승인 절차 (관리자 확인)
# 4. **모호한 표현을 쓰지 않는다.** "소액", "고가", "적절한", "필요한 경우" 대신 금액이나
#    조건을 명시한다. "회원 동의"도 "재적 회원 과반의 동의"처럼 기준을 밝힌다.
# 5. **허용을 말하는 조항에는 반드시 한도나 조건이 붙는다.** 한도 없는 허용은 심사기가
#    판단할 수 없고, 회원에게도 기준이 되지 못한다.
# 6. **시스템 내부 표기를 쓰지 않는다.** 카테고리 식별자(장소_대관·행사_활동·IT_인프라)가
#    아니라 사람이 쓰는 말(장소 대관비·행사·활동비·IT 인프라 비용)로 적는다. 다만 카탈로그
#    9종에 대응하지 않는 분류명("다과비" 등)은 여전히 금지 — 회원이 지출을 올릴 때 고르는
#    분류와 회칙 용어가 어긋나면 심사기가 엉뚱한 조항을 근거로 물어온다.
#
# ── 금액 placeholder ──────────────────────────────────────────────────────
# {auto_approve_limit} : 화면 입력 기준 금액. **자동 심사·관리자 승인을 말하는 조항이
#                        인용할 수 있는 유일한 금액**이다(verify_draft_pure가 다른 금액을 막는다).
#                        ⚠️ 그래서 '자동 심사'·'관리자 승인/확인'이라는 말이 든 조에는
#                        한도 placeholder({gift} 등)를 같이 쓰면 안 된다 — 두 금액이
#                        우연히 같지 않으면 초안이 통째로 500이 된다. 회사 유형
#                        경조사비 조가 그렇게 죽어 있었다 (2026-08-12).
# {meal}·{venue}·{supplies}·{transport}·{education}·{event}·{gift}·{travel}
#                      : limits로 예산·인원에서 산출된 한도. 자동 심사 문구와 같은 조에
#                        쓰지 말 것 — 검증기에 걸린다.
# {dues}               : 회비. 사용자 입력이 있을 때만 치환되며, 없으면 해당 조가 빠진다.
#
# ── text_no_auto (조 단위 선택 키) ────────────────────────────────────────
# 기준 금액이 0일 때, 즉 '모든 지출을 관리자가 직접 확인'(화면 토글)일 때 쓸 대체 본문.
# 기본 text를 그대로 치환하면 "1건 0원 미만의 지출은 AI가 자동 심사한다"처럼 **존재할 수
# 없는 금액 구간**을 말하는 조가 된다. 확정된 회칙은 인덱싱되어 심사 근거가 되므로
# 공허한 조항을 남기지 않는다. 키가 없는 조는 기본 text를 그대로 쓴다.

동아리/학생회:
  # 심사용 — 짧게 유지 (위 주석 참조)
  base_rules:
    - "모든 지출은 영수증(현금영수증·카드전표)을 첨부해야 하며, 미첨부 시 지출로 인정하지 않는다."
    - "1인당 식비는 회당 {meal}원을 초과할 수 없다."
    - "개인 용도 물품 구입은 회비 지출로 인정하지 않는다."
    - "행사비는 행사 계획을 사전 공유한 건에 한해 집행한다."
    - "{auto_approve_limit}원 미만의 지출은 AI 자동 심사로 처리하고, {auto_approve_limit}원 이상은 관리자 승인을 받는다."
  limits:
    # meal.max는 80,000 — 75,000은 round_bylaw_amount의 10,000원 격자 밖이라
    # (round(7.5)=8) 포화 구간에서 회칙에 80,000원이 적혀 상한 불변식이 깨진다
    # (#80 리뷰). max는 반드시 격자(5만 미만 5천·20만 미만 1만·이상 5만) 위의 값으로.
    meal: {basis: per_person, ratio: 0.12, min: 12000, max: 80000}
    venue: {basis: total, ratio: 0.03, min: 20000, max: 600000}
    supplies: {basis: total, ratio: 0.08, min: 30000, max: 1000000}
    transport: {basis: per_person, ratio: 0.25, min: 20000, max: 200000}
    education: {basis: per_person, ratio: 0.30, min: 20000, max: 500000}
    event: {basis: total, ratio: 0.10, min: 50000, max: 2000000}
  max_extra_rules: 4
  dues_default: 10000
  dues_period: 학기당
  bylaw_articles:
    # 동아리/학생회 9조 — 조직 운영 조항(회원의 의무·임원과 의결)을 유지하는 중간 무게.
    # 통합: 목적+운영 원칙 → 제1조, 임원+의결 → 제3조, 예산 집행 원칙+지출 심사 → 제5조,
    # 교육·행사 지출 → 인정 가능한 지출, 청구의 진실성 → 인정하지 않는 지출,
    # 증빙+회계 공개 → 제8조, 예외 승인+회칙의 개정 → 제9조.
    - title: 목적과 운영 원칙
      text: "① 이 회칙은 동아리 운영과 회비·예산 집행 기준을 정한다. ② 동아리는 회원의 자율적 참여로 운영하며, 예산 집행 내역과 의사결정 결과를 공개한다."
    - title: 회원의 의무
      text: "① 회원은 회칙과 총회 의결 사항을 준수한다. ② 분담금은 정해진 기한 내에 납부한다. ③ 맡은 역할은 성실히 수행한다."
    - title: 임원과 의결
      text: "① 회장 1인과 총무 1인을 두며, 총무가 예산·지출 기록과 정산 공개를 맡는다. ② 회칙 개정·임원 선출·연간 예산은 재적 회원 과반 출석과 출석 과반 찬성으로 의결하고, 일상 운영은 임원이 결정해 공유한다."
    - title: 회비
      requires_dues: true
      text: "회비는 1인당 {dues_period} {dues}원으로 하며, 금액과 납부 주기는 재적 회원 과반의 찬성으로 변경한다."
    - title: 지출 심사
      text: "① 지출은 보유 잔액 범위에서 집행하며, 보유 잔액이 부족한 지출은 금액과 관계없이 승인하지 아니한다. ② 1건 {auto_approve_limit}원 미만은 회칙·예산·증빙을 기준으로 AI가 자동 심사하고, 이상은 관리자 승인을 받는다. ③ 금액과 관계없이 회칙 해석이 불명확하거나 증빙이 불충분하거나 중복 청구가 의심되면 관리자가 확인한다."
      # text_no_auto에도 ①(잔액 부족 → 승인 안 함)을 유지한다 — 통합 조에서 이 규범이
      # 0원 경로만 빠지면 잔액 부족 반려의 회칙 근거가 사라진다 (#83 리뷰 HIGH2).
      text_no_auto: "① 지출은 보유 잔액 범위에서 집행하며, 보유 잔액이 부족한 지출은 승인하지 아니한다. ② 모든 지출은 금액과 관계없이 관리자 승인을 받는다. ③ AI는 회칙·예산·증빙을 기준으로 심사 의견과 그 근거를 제시하고, 최종 결정은 관리자가 한다."
    - title: 인정 가능한 지출
      text: "① 식비: 1인 1회 {meal}원 이내로 하며 참석 인원을 적는다. ② 장소 대관비: 회당 {venue}원 이내. ③ 비품비: 분기 {supplies}원 이내. ④ 교통비: 대외 활동은 1인당 {transport}원 이내로 실비 인정하며 출발지·목적지와 활동명을 적는다. ⑤ 교육비: 교재·강의·세미나는 1인당 {education}원 이내. ⑥ 행사·활동비: 정기 행사·신입 모집·홍보물은 건당 {event}원 이내로 하며 계획을 사전 공유한다. ⑦ 대외 활동 참가비: 외부 대회·공모전 등록비는 건당 {event}원 이내로 하며 참가 인원과 요강을 증빙한다."
    - title: 인정하지 않는 지출
      text: "다음은 인정하지 아니한다. ① 개인 소유·사용 물품 구입비·개인 식사비·통근 등 개인 이동 비용 ② 주류만을 목적으로 한 지출과 회원 일부만 참여한 사적 모임 비용 ③ 벌금·과태료·연체료 ④ 이미 정산받은 지출의 재청구, 기준 금액 회피용 분할 청구, 실제 거래와 다른 청구"
    - title: 증빙과 회계
      text: "① 지출은 영수증 등 증빙을 첨부하며 일시·금액·거래처·내용이 확인돼야 한다. ② 확인이 어려우면 추가 증빙을 요청하고 확인될 때까지 승인을 보류하며, 사유서만으로는 지출을 인정하지 아니한다. ③ 총무는 수입·지출·잔액을 기록해 월 1회 이상 공유하고 1년간 보관한다."
    - title: 예외 승인과 개정
      text: "① 항목별 한도를 초과하지만 전체 잔액이 충분한 지출은 사유를 사전 공유하고 재적 회원 과반의 찬성으로 집행할 수 있다. ② 보유 잔액 부족·개인성 지출·중복·분할·허위 청구는 예외 승인의 대상이 되지 아니한다. ③ 개정은 재적 회원 과반의 찬성으로 확정한다."

스터디:
  base_rules:
    - "모든 지출은 영수증을 첨부해야 한다."
    - "도서·강의 구입은 스터디 주제와 관련된 항목만 인정한다."
    - "1인당 식비는 회당 {meal}원 한도로 집행한다."
    - "구독형 서비스는 스터디 기간 내 결제분만 인정한다."
    - "{auto_approve_limit}원 미만 지출은 AI 자동 심사, {auto_approve_limit}원 이상은 관리자 승인."
  limits:
    meal: {basis: per_person, ratio: 0.10, min: 10000, max: 60000}
    venue: {basis: total, ratio: 0.025, min: 20000, max: 500000}
    supplies: {basis: total, ratio: 0.08, min: 30000, max: 1000000}
    transport: {basis: per_person, ratio: 0.25, min: 20000, max: 200000}
    education: {basis: per_person, ratio: 0.40, min: 30000, max: 750000}
    # 대외 활동 참가비(외부 대회·공모전 등록비)가 인용한다 — PR #82 흡수.
    event: {basis: total, ratio: 0.04, min: 30000, max: 750000}
  max_extra_rules: 3
  dues_default: 20000
  dues_period: 월
  bylaw_articles:
    # 스터디 8조 — 친목(7조) 다음으로 가볍다. 통합: 목적+활동+출석+발표와 과제 → 제1조,
    # 예산 집행 원칙+지출 심사 → 제4조, 식비·교통비+IT 인프라 → 인정 가능한 지출,
    # 청구의 진실성 → 인정하지 않는 지출, 증빙+회계 공개 → 제7조, 예외 승인+개정 → 제8조.
    - title: 목적과 활동
      text: "① 이 회칙은 스터디 운영과 공동 비용 집행 기준을 정한다. ② 학습 주제와 모임 일정·발표 순서는 회원 합의 또는 운영진 공지로 정한다."
    - title: 운영진
      text: "스터디장 1인과 총무 1인을 두되 소규모는 겸임할 수 있으며, 총무가 예산·지출 기록과 정산 공개를 맡는다."
    - title: 회비
      requires_dues: true
      text: "회비는 1인당 {dues_period} {dues}원으로 하며, 고정비가 없는 기간에는 재적 회원 과반의 찬성으로 징수를 중단할 수 있다."
    - title: 지출 심사
      text: "① 지출은 보유 잔액 범위에서 집행하며, 보유 잔액이 부족한 지출은 금액과 관계없이 승인하지 아니한다. ② 1건 {auto_approve_limit}원 미만은 회칙·예산·증빙을 기준으로 AI가 자동 심사하고, 이상은 관리자 승인을 받는다. ③ 금액과 관계없이 회칙 해석이 불명확하거나 증빙이 불충분하거나 중복 청구가 의심되면 관리자가 확인한다."
