  bylaw_articles:
    - title: 목적
      text: "이 회칙은 모임의 정기적인 친목 활동과 공동 비용의 공정한 사용을 위한 기준을 정하는 것을 목적으로 한다."
    - title: 운영 원칙
      text: "① 모임은 자발적 참여와 상호 존중을 원칙으로 하며, 참석과 지출 분담을 강제하지 아니한다. ② 공동 비용의 사용 내역은 회원 누구나 확인할 수 있도록 공개한다."
    - title: 참여
      text: "① 참석 여부는 자율로 하되, 예약이 필요한 모임은 공지된 기한까지 참석 여부를 알린다. ② 예약 후 무단 불참으로 위약금이 발생한 경우 해당 회원이 부담한다."
    - title: 총무
      text: "① 모임은 총무 1인을 두어 공동 비용을 관리한다. ② 총무는 지출 기록, 증빙 보관, 잔액 및 주요 지출 내역의 공개를 담당한다."
    - title: 회비
      requires_dues: true
      text: "① 회비는 1인당 {dues_period} {dues}원으로 한다. ② 회비는 정해진 기한 내에 납부한다. ③ 회비의 금액과 납부 주기는 재적 회원 과반의 찬성으로 변경할 수 있다."
    - title: 예산 집행 원칙
      text: "① 지출은 보유 잔액의 범위 안에서 집행한다. ② 보유 잔액이 부족한 지출은 금액과 관계없이 승인하지 아니한다."
    - title: 지출 심사
      text: "① 1건 {auto_approve_limit}원 미만의 지출은 회칙·예산·증빙을 기준으로 AI가 자동 심사한다. ② 1건 {auto_approve_limit}원 이상의 지출은 관리자 승인을 받는다. ③ 금액과 관계없이 회칙 해석이 불명확한 경우, 증빙이 불충분하거나 청구 내용이 증빙과 일치하지 않는 경우, 중복 청구가 의심되는 경우에는 관리자 확인을 거친다. ④ AI 심사 결과에 이의가 있는 회원은 관리자에게 재심사를 요청할 수 있다."
    - title: 참여 요건
      text: "재적 회원 과반이 참여하지 않은 활동의 비용은 공동 비용으로 집행하지 아니한다. 다만 사전에 재적 회원 과반의 찬성을 얻은 경우에는 그러하지 아니하다."
    - title: 인정 가능한 지출
      text: "① 식비: 정기 모임의 식사 비용은 1인 1회 {meal}원 이내로 인정한다. ② 장소 대관비: 모임 장소 대관 비용은 회당 {venue}원 이내로 인정한다. ③ 행사·활동비: 정기 나들이·기념 행사 비용은 건당 {event}원 이내로 인정하며, 일정과 예상 금액을 사전에 공유한다."
    - title: 경조사비
      text: "① 회원의 결혼·출산·상(喪) 등 경조사와 생일에 대한 지출은 1건 {gift}원 이내로 인정한다. ② 대상과 금액은 지출 전에 회원에게 공유한다. ③ 같은 사유로 중복하여 집행하지 아니한다."
    - title: 여행·숙박
      text: "① 숙박을 동반한 여행은 일정과 예산을 사전에 공유하고 재적 회원 과반의 찬성을 얻은 경우에 한해 집행하며, 1인 1박 {travel}원 이내로 인정한다. ② 불참 회원의 몫은 공동 비용에서 부담하지 않고 참가자 기준으로 정산한다."
    - title: 교통비·비품비
      text: "① 교통비: 공동 이동에 사용한 비용은 참여 인원 기준으로 1인당 {transport}원 이내로 인정한다. ② 비품비: 모임이 공동으로 사용하는 물품은 분기 {supplies}원 이내로 인정한다."
    - title: 인정하지 않는 지출
      text: "① 개인 식사비, 개인 이동 비용, 개인이 소유하는 물품 구입비는 인정하지 아니한다. ② 1인 1회 {meal}원을 초과하는 식사 비용 중 초과분은 해당 참가자가 부담한다. ③ 벌금·과태료·연체료는 인정하지 아니한다."
