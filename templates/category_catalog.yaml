# 모임 유형별 지출 카테고리 카탈로그 (팀 확정 2026-07-10 — 유형당 6개 고정)
# 카테고리 동적 추가 금지(백엔드 DB 협의 사항) — 분류는 반드시 이 목록 안에서만.
#
# keywords: 목 모드·LLM 폴백용 결정적 분류 규칙. 위에서부터 먼저 매칭되는 항목이
