# 지출 카테고리 카탈로그 — 전역 9종 고정 (풀스택 협의 2026-08-04 · ENUM 확장 확정 2026-08-05).
#
# 종전에는 모임 유형별로 6개씩(5유형 30종) 달랐다. 백엔드 expenses.category ENUM과
# 겹치는 값이 하나도 없어 저장이 안 되는 문제가 있었고, 협의 결과 **모임 유형과
# 무관한 전역 9종**으로 통일했다. 백엔드가 ENUM에 2종을 더해 9종으로 확장해 주기로
# 하여(2026-08-05), **이 목록이 곧 ENUM 저장값이다** — AI가 새 값을 만들지 않는다.
#   확장 내역: 기존 ENUM 7종에서 `디자인`·`행사`를 빼고 `장소_대관`·`교통`·`비품`·
#   `행사_활동`을 더한다. 순증가는 2종이지만 **새로 생기는 값은 4종**이라, 마이그레이션
#   전에는 그 4종의 콜백 저장이 실패한다 (시점 회신 대기). 유지되는 5종은 `회의`·
#   `IT_인프라`·`교육`·`식비`·`기타`다.
#
# ⚠️ name은 **저장값(언더바)** 이다. ENUM 값에는 슬래시를 넣을 수 없어 `IT_인프라`·
#   `장소_대관`·`행사_활동`으로 적는다. 화면에 보이는 `IT/인프라`·`장소/대관`·
#   `행사/활동`은 **프론트가 출력 시점에 `_`를 `/`로 바꿔** 만든다. 표시 표현을
#   서버가 들고 있으면 콜백·API·프롬프트 중 한 곳이 빠졌을 때 조용히 어긋나므로,
#   원본은 이 파일 하나로 유지한다 (PR #9 리뷰 D1).
#
# keywords: 목 모드·LLM 폴백용 결정적 분류 규칙.
#   - 매칭은 **부분 문자열**이다(`키워드 in 소문자화한_텍스트`). 그래서 짧은 낱말은
#     넣지 않는다 — '술'은 기술·미술·예술에, '공'은 공연·공간에, '책'은 책상에
#     걸린다. 구체적인 낱말만 쓴다.
#   - 위에서부터 먼저 매칭되는 카테고리가 이긴다. 그래서 순서는 **구체적인 것 →
#     광범위한 것**이다. '구입' 같은 넓은 낱말을 가진 비품이 맨 아래에 있는 이유다.
#   - 카테고리 간 키워드는 되도록 겹치지 않게 뒀다. 겹치면 순서에만 의존하게 되어
#     결과를 예측하기 어렵다.
#
# fallback: 키워드 미매칭·LLM 실패 시 사용. 전역이라 '기타' 하나다. 종전에는
#   유형별로 '가장 범용적인 실제 카테고리'였는데, 그러면 못 알아본 지출이 실제
#   카테고리에 조용히 섞여 통계를 오염시킨다. '기타'로 두면 미분류가 눈에 보인다.

version: 2
fallback: 기타

categories:
  # 어휘가 가장 구체적이라 맨 위 — 오분류 시 바로 티가 난다
  - name: 식비
    keywords: [회식, 식사, 식대, 점심, 저녁, 야식, 간식, 다과, 커피, 음료, 카페,
               치킨, 피자, 케이크, 브런치, 뒤풀이, 밥, 도시락, 김밥, 샌드위치]

  - name: 교통
    keywords: [택시, 버스, 기차, ktx, 항공, 교통, 주유, 주차, 톨게이트, 출장, 이동]

  # 구독·인프라 — 다른 카테고리와 어휘가 겹치지 않는다
  - name: IT_인프라
    keywords: [소프트웨어, saas, 라이선스, 구독, 클라우드, 서버, 도메인, 노션,
               슬랙, 인프라, 멤버십, 호스팅]

  # 학습 자료를 가리키는 낱말을 넓혔다 (2026-08-06). "교재 구입"은 맞았지만 "책 구입"
  # ·"스터디 자료 구입"처럼 조금만 달리 쓰면 비품의 '구입'에 걸려 비품이 됐다.
  # 맨낱말 '책'·'자료'는 넣지 않는다 — '책'은 책상·책장에, '자료'는 '홍보 자료'에
  # 걸린다(실측 확인). 두 글자 이상으로 뜻이 굳은 낱말만 쓴다.
  - name: 교육
    keywords: [교재, 도서, 서적, 자료집, 문제집, 참고서, 원서, 학습지, 스터디 자료,
               학습, 강의, 인강, 수강, 강연, 세미나, 특강, 연사, 교육, 컨퍼런스,
               실습, 키트]

  # '회의실'이 여기 걸리도록 장소/대관보다 위에 뒀다 — "회의실 대관"은 회의로 본다.
  # 맨낱말 '회의'는 뺐다 — "회의용 마커 구입"까지 회의로 끌어가서 비품을 가로챘다.
  # 회의는 대개 '회의실'·'총회'처럼 구체적인 낱말로 나타난다.
  - name: 회의
    keywords: [회의실, 회의비, 회의 진행, 총회, 정기모임, 워크숍, 미팅, 간담회, 운영비]

  - name: 장소_대관
    keywords: [대관, 스터디룸, 파티룸, 룸카페, 연습실, 풋살장, 체육관, 구장, 코트,
               숙박, 펜션, 호텔, 에어비앤비, 리조트, 장소, 공간, 예약]

  - name: 행사_활동
    keywords: [행사, 축제, 엠티, 공연, 대회, 참가비, 리그, 시합, 정기전, 등록비,
               부스, 프로그램, 레슨, 클래스, 강습, 활동, 레저, 액티비티, 볼링,
               방탈출, 보드게임, 노래방, 영화, 테마파크, 캠핑, 여행, 현수막,
               포스터, 홍보, 배너, 굿즈, 디자인, 로고, 외주, 제작 의뢰]
    # 선물·기념·경조사는 뺐다 — 모임 활동이 아니라 개인 대상 지출이고, 회칙 한도를
    # 걸 성격도 다르다. 키워드를 빼면 '기타'로 떨어지는데 실모드 분류기도 독립적으로
    # 기타로 판단했다(경조사 조화 → 기타 0.85). 둘이 어긋나 있던 것을 맞춘 것이다.
    #
    # 디자인·로고·외주·제작 의뢰는 2026-08-05에 넣었다 (PR #9 리뷰 4-2). 구 ENUM 7종에
    # 있던 '디자인'이 9종에서 빠지면서, 홍보물(현수막·포스터·배너·굿즈)은 이미 여기
    # 걸렸지만 **로고 제작 같은 순수 디자인 외주는 '기타'로 떨어지는 공백**이 있었다.
    # '디자인'은 부분 문자열이라 '디자인 강의'가 교육보다 먼저 걸릴 수 있는데, 교육이
    # 위에 있어 '강의'가 먼저 매칭되므로 순서로 해소된다.

  # 위에서 안 걸린 것만 여기로 온다.
  #
  # **'구입'을 뺐다 (2026-08-06).** 지출이라면 무엇에나 붙는 말이라 분류 정보가 사실상
  # 0인데, 맨 아래에 있어도 위에서 안 걸린 것을 전부 비품으로 확정해 버렸다 —
  # 상품권·꽃다발·티켓·마이크가 전부 비품이 됐다(실측). 빼면 그런 지출이 '기타'로
  # 가는데, **비품으로 잘못 확정되는 것보다 미분류가 눈에 보이는 편이 낫다**(위 fallback
  # 주석과 같은 원칙). 구체적인 물건 이름은 아래 목록이 이미 잡는다.
  - name: 비품
    keywords: [물품, 비품, 소모품, 문구, 사무용품, 포스트잇, 마커, 노트, 모니터,
               책상, 책장, 서랍, 의자, 장비, 용품, 라켓, 셔틀콕, 유니폼, 글러브,
               마이크, 스피커, 케이블, 공유기, 충전기, 프로젝터,
               인쇄, 프린트, 제본, 복사]

  # 위 어디에도 안 걸린 지출. 키워드 없음 — fallback으로만 도달한다
  - name: 기타
    keywords: []
