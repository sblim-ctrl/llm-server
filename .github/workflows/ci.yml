# CI Merge Gate
#
# CLAUDE.md 정의: "머지 게이트: uv run pytest 전체 통과 + run_eval 오승인 0건·정확도 ≥90%".
# writers 골든셋(run_eval_writers, 검증 불통과 0건·정확도 ≥90%)도 동일 철학으로 추가.
# lint는 이 게이트 정의에 없으므로 포함하지 않는다.
#
# Triggers:
#   - pull_request: main 대상
#   - push: main

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  merge-gate:
    name: pytest + run_eval + run_eval_writers
    runs-on: ubuntu-latest
    # timeout-minutes는 스텝 실행 시간이 아니라 **러너를 기다린 시간까지 포함**해서 센다.
    # 15분으로 두었다가 2026-08-07에 main 포함 4건이 정확히 15분에서 잘렸는데, 잘린 잡의
    # steps 배열이 전부 비어 있었다 — 체크아웃도 못 한 채 대기하다 죽은 것이다:
    #   gh api repos/<owner>/<repo>/actions/runs/<id>/jobs \
    #     --jq '.jobs[] | "\(.conclusion) 스텝 \(.steps|length)개"'
    # 같은 날 통과한 실행의 스텝 합은 42초였고 로컬 실측도 pytest 6초 + run_eval 9초 +
    # writers 3초다. 스위트가 무거워서가 아니라 러너가 안 나와서 잘렸으므로 대기 여유를 준다.
    # **다시 줄이려면 먼저 위 명령으로 스텝이 실제로 돌았는지 확인할 것.**
    timeout-minutes: 30

    services:
      llm-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: budgetops
          POSTGRES_PASSWORD: budgetops
          POSTGRES_DB: budgetops_llm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budgetops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://budgetops:budgetops@localhost:5432/budgetops_llm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Check OpenAPI spec matches code
        run: uv run python scripts/dump_openapi.py --check

      - name: Run pytest
        run: uv run pytest -q

      - name: Run golden-set eval gate (run_eval)
        run: uv run python -m eval.run_eval

      - name: Run writers golden-set eval gate (run_eval_writers)
        run: uv run python -m eval.run_eval_writers
