# 모델 라우팅 설정 (§3.1) — 코드 수정 없이 모델 교체 가능
# 원칙: 판단이 필요한 곳은 gpt-4o, 요약·분류·해석은 gpt-4o-mini
agents:
  intake: gpt-4o                # Vision OCR
  classifier: gpt-4o-mini       # 카테고리 자동 분류 (팀 합의)
  rule_auditor: gpt-4o
  budget_auditor: gpt-4o-mini   # 수치 계산은 코드, LLM은 해석만
  precedent_auditor: gpt-4o
  adjudicator: gpt-4o
  policy_drafter: gpt-4o
  report_writer: gpt-4o-mini
  briefing_writer: gpt-4o
  digest_writer: gpt-4o-mini    # 주간 브리핑 — 수치는 코드, LLM은 문구만 (C7 — A 소유 줄)
  judge: gpt-4o                 # LLM-as-Judge — 사유 품질 채점 (평가 전용, 심사 무관)
                                # mini→4o 승급(7/29 실측): mini가 faithfulness 다중 필드
                                # 대조에서 few_shot 앵무새·필드 혼동을 프롬프트 교정으로도
                                # 못 벗어남. 평가 전용이라 비용 영향 미미(~$0.005/건)
  query_rewriter: gpt-4o-mini   # rule_auditor CRAG 재검색 질의 재작성 — 드문 경로·저가 (A 소유 줄)
  default_policy: gpt-4o-mini   # 회칙 미등록 팀의 기본 정책 모드 심사 (A 소유 줄).
                                # rule_auditor(4o)와 달리 mini인 이유: 이 모드는 fail을 낼
                                # 수 없어 최악이 'warn을 놓쳐 pass'인데, 그건 이 경로의
                                # 종전 동작(무조건 pass)과 똑같다 — 기준선보다 나빠질 수
                                # 없다. 회칙 없는 팀의 전 건이 지나는 경로라 비용도 크다.
                                # 실측에서 놓침이 보이면 4o 승급.
  budget_planner: gpt-4o-mini   # 수치는 코드(burn_rate_forecast), LLM은 문구만 (C7 — B 소유 줄)
  rule_amendment: gpt-4o        # 회칙 개정 문안 — 판단 성격 (C7 — B 소유 줄)

embeddings: text-embedding-3-small   # 1536차원

# 단가표 (USD / 1M tokens) — cost_usd 계산용 (B2). 모델 교체 시 여기도 갱신할 것.
pricing:
  gpt-4o: {input: 2.50, output: 10.00}
  gpt-4o-mini: {input: 0.15, output: 0.60}
  text-embedding-3-small: {input: 0.02, output: 0.00}
