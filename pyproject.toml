[project]
name = "budgetops-llm-server"
version = "0.1.0"
description = "BudgetOps LLM 에이전트 서버 — 지출 자동 심사 (FastAPI + LangGraph)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "langgraph>=0.2.60",
    "langchain-openai>=0.2.10",
    "langgraph-checkpoint-postgres>=2.0",
    "langsmith>=0.1.140",
    "mcp>=1.28.1",
    # 회칙 파일 파싱 (T2) — 마법사 3단계 파일 업로드 회칙을 심사에 반영하는 경로.
    # 지원 형식은 pdf·docx 둘뿐이다(회의 4번 결정). 둘 다 순수 파이썬이라 시스템
    # 의존성이 없어 GCP 배포 이미지가 무거워지지 않는다.
    "pypdf>=5.1",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "jupyter>=1.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "alembic>=1.18.5",
    "pillow>=11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
