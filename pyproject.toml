[project]
name = "budgetops-llm-server"
version = "0.1.0"
description = "BudgetOps LLM 에이전트 서버 — 지출 자동 심사 (FastAPI + LangGraph)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "langgraph>=0.2.60",
    "langchain-openai>=0.2.10",
    "langgraph-checkpoint-postgres>=2.0",
    "langsmith>=0.1.140",
    "mcp>=1.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "jupyter>=1.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "alembic>=1.18.5",
    "pillow>=11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
